name: Build PixelOS Directly on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: 'PixelOS Branch'
        required: true
        default: 'fourteen-qpr1'
        type: choice
        options:
          - fourteen-qpr1
          - fourteen
          - fifteen
      build_target:
        description: 'Build Target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
          - vendorbootimage

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Maximize Runner Free Disk Space (Stable Margins)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 1024
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'false'

      - name: Unmount and Completely Purge Snaps
        run: |
          echo "=== Disk space before unmounting snaps ==="
          df -h
          sudo systemctl disable --now snapd.service snapd.socket 2>/dev/null || true
          for m in /snap/*/*; do
            if mountpoint -q "$m"; then
              sudo umount -l "$m" 2>/dev/null || true
            fi
          done
          sudo apt-get purge -y snapd 2>/dev/null || true
          sudo rm -rf /snap /var/snap /var/lib/snapd /var/cache/snapd ~/snap 2>/dev/null || true

      - name: Extreme Heavyweight Software & Database Purge
        run: |
          echo "=== Purging heavy browsers, SDKs, databases, and unused runtimes ==="
          sudo apt-get purge -y \
            azure-cli \
            google-cloud-sdk \
            google-chrome-stable \
            firefox \
            microsoft-edge-stable \
            mysql-server mysql-client mysql-common \
            postgresql postgresql-client postgresql-common \
            mongodb-org* \
            libpq-dev \
            nginx \
            apache2* \
            ant ant-optional \
            kubectl \
            helm \
            subversion \
            mercurial 2>/dev/null || true
          
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/php*
          sudo rm -rf /usr/share/sbt*
          sudo rm -rf /usr/share/gradle*
          sudo rm -rf /usr/share/apache-maven*
          sudo rm -rf /usr/lib/jvm/temurin-*
          sudo rm -rf /usr/lib/jvm/zulu-*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/info/*
          sudo rm -rf /usr/share/locale/*
          sudo rm -rf /usr/share/fonts/*
          sudo rm -rf /var/cache/apt/*
          sudo rm -rf /var/lib/mysql
          sudo rm -rf /var/lib/postgresql
          sudo rm -rf /var/log/*
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          echo "=== Free space after extreme purge ==="
          df -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-21-jdk aria2 libtinfo5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60

      - name: Initialize PixelOS Manifest on Maximized LVM Mount
        run: |
          TARGET_DIR="$GITHUB_WORKSPACE/pixelos"
          mkdir -p "$TARGET_DIR"
          echo "WORK_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd "$TARGET_DIR"
          echo "=== Target directory disk free ==="
          df -h .
          repo init -u https://github.com/PixelOS-Fourteen/manifest.git -b ${{ github.event.inputs.pixelos_branch }} \
            --groups=default,-mips,-x86,-darwin,-emulator,-notdefault,-tests,-cts,-device \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none < /dev/null

      - name: Inject Local Manifests (Tecno KJ7 + Extreme Bloat Removal)
        run: |
          cd $WORK_DIR
          mkdir -p .repo/local_manifests
          
          # 1. Device tree, Vendor tree, Kernel tree
          cat << 'EOF' > .repo/local_manifests/kj7.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/tecno/kj7" name="RapStuff/android_device_tecno_kj7" revision="lineage-23.0" remote="github" />
            <project path="vendor/tecno/kj7" name="RapStuff/android_vendor_tecno_kj7" revision="lineage-22.1" remote="github" />
            <project path="kernel/tecno/kj7" name="RapStuff/android_kernel_tecno_kj7" revision="lineage-23.0" remote="github" />
          </manifest>
          EOF

          # 2. Comprehensive bloat removal (Car, TV, CTS, VTS, Darwin, Emulators) -> Saves 50+ GB!
          cat << 'EOF' > .repo/local_manifests/remove_bloat.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Heavy Test Suites -->
            <remove-project name="platform/cts" />
            <remove-project name="platform/pdk" />
            <remove-project name="platform/developers/build" />
            <remove-project name="platform/developers/demos" />
            <remove-project name="platform/developers/samples/android" />
            <remove-project name="platform/test/vts" />
            <remove-project name="platform/test/vts-testcase/kernel" />
            <remove-project name="platform/test/vts-testcase/hal" />
            <remove-project name="platform/test/vts-testcase/hal-trace" />
            <remove-project name="platform/test/vts-testcase/security" />
            <remove-project name="platform/test/vts-testcase/performance" />
            <remove-project name="platform/test/vts-testcase/vndk" />
            <remove-project name="platform/tools/test/connectivity" />
            <remove-project name="platform/tools/test/graphicsbenchmark" />
            <remove-project name="platform/tools/test/mobly_extensions" />
            <remove-project name="platform/tools/test/mobly_snippets" />
            <remove-project name="platform/tools/test/openhst" />
            
            <!-- Android Auto / Car Apps (Zero need on Tecno Spark phone) -->
            <remove-project name="platform/packages/apps/Car/SystemUI" />
            <remove-project name="platform/packages/apps/Car/Cluster" />
            <remove-project name="platform/packages/apps/Car/DebuggingRestrictionController" />
            <remove-project name="platform/packages/apps/Car/DialerPrebuilt" />
            <remove-project name="platform/packages/apps/Car/LatinIME" />
            <remove-project name="platform/packages/apps/Car/Launcher" />
            <remove-project name="platform/packages/apps/Car/LinkViewer" />
            <remove-project name="platform/packages/apps/Car/LocalMediaPlayer" />
            <remove-project name="platform/packages/apps/Car/MediaPrebuilt" />
            <remove-project name="platform/packages/apps/Car/MessengerPrebuilt" />
            <remove-project name="platform/packages/apps/Car/Notification" />
            <remove-project name="platform/packages/apps/Car/Provision" />
            <remove-project name="platform/packages/apps/Car/Radio" />
            <remove-project name="platform/packages/apps/Car/RotaryController" />
            <remove-project name="platform/packages/apps/Car/Settings" />
            <remove-project name="platform/packages/apps/Car/SettingsIntelligence" />
            <remove-project name="platform/packages/apps/Car/systemlibs" />
            <remove-project name="platform/packages/apps/Car/SystemUpdater" />

            <!-- Android TV Apps -->
            <remove-project name="platform/packages/apps/TvSettings" />
            <remove-project name="platform/packages/apps/TvSystemUI" />
            <remove-project name="platform/packages/apps/TV" />

            <!-- Unused Generic Architectures & Emulators -->
            <remove-project name="platform/prebuilts/android-emulator" />
            <remove-project name="platform/prebuilts/clang/host/darwin-x86" />
            <remove-project name="platform/prebuilts/bazel/darwin-x86_64" />
            <remove-project name="platform/prebuilts/go/darwin-x86" />
            <remove-project name="device/amlogic/yukawa" />
            <remove-project name="device/amlogic/yukawa-kernel" />
            <remove-project name="device/generic/arm64" />
            <remove-project name="device/generic/armv7-a-neon" />
            <remove-project name="device/generic/car" />
            <remove-project name="device/generic/goldfish" />
            <remove-project name="device/generic/goldfish-opengl" />
            <remove-project name="device/generic/mini-emulator-arm64" />
            <remove-project name="device/generic/mini-emulator-armv7-a-neon" />
            <remove-project name="device/generic/mini-emulator-x86" />
            <remove-project name="device/generic/mini-emulator-x86_64" />
            <remove-project name="device/generic/qemu" />
            <remove-project name="device/generic/uml" />
            <remove-project name="device/generic/x86" />
            <remove-project name="device/generic/x86_64" />
          </manifest>
          EOF

      - name: Sync Source Tree
        run: |
          cd $WORK_DIR
          # -j8 for fast download, --optimized-fetch, and --prune
          repo sync -c -j8 --force-sync --no-clone-bundle --no-tags --prune

      - name: Strip Entire DotRepo Metadata and Unneeded Trees
        run: |
          cd $WORK_DIR
          echo "=== Storage before .repo elimination ==="
          df -h .
          rm -rf .repo
          rm -rf cts pdk toolchain developers sdk
          rm -rf prebuilts/clang/host/darwin-x86
          rm -rf prebuilts/gcc/darwin-x86
          rm -rf prebuilts/gcc/linux-x86/arm
          rm -rf prebuilts/gcc/linux-x86/mips
          rm -rf prebuilts/gcc/linux-x86/x86
          echo "=== Storage after .repo elimination ==="
          df -h .

      - name: Configure KJ7 Makefiles for PixelOS
        run: |
          cd $WORK_DIR/device/tecno/kj7
          cat << 'EOF' > AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/pixelos_kj7.mk

          COMMON_LUNCH_CHOICES := \
              pixelos_kj7-user \
              pixelos_kj7-userdebug \
              pixelos_kj7-eng
          EOF

          cat << 'EOF' > pixelos_kj7.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, device/tecno/kj7/device.mk)
          $(call inherit-product, vendor/pixelos/config/common_full_phone.mk)

          PRODUCT_NAME := pixelos_kj7
          PRODUCT_DEVICE := kj7
          PRODUCT_MANUFACTURER := TECNO
          PRODUCT_BRAND := TECNO
          BOARD_VENDOR := TECNO
          PRODUCT_MODEL := TECNO Spark 20 Pro+
          PRODUCT_GMS_CLIENTID_BASE := android-tecno
          PRODUCT_BUILD_PROP_OVERRIDES += \
              DeviceName=KJ7 \
              BuildFingerprint=TECNO/KJ7-OP/TECNO-KJ7:14/UP1A.231005.007/260112V2294:user/release-keys
          EOF

          sed -i 's/BOARD_BOOTIMAGE_PARTITION_SIZE := .*/BOARD_BOOTIMAGE_PARTITION_SIZE := 67108864/g' BoardConfig.mk
          sed -i 's/BOARD_SUPER_PARTITION_SIZE := .*/BOARD_SUPER_PARTITION_SIZE := 8870707200/g' BoardConfig.mk
          sed -i 's/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := .*/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := 8868610048/g' BoardConfig.mk

      - name: Compile PixelOS for Tecno KJ7
        run: |
          cd $WORK_DIR
          source build/envsetup.sh
          lunch pixelos_kj7-userdebug
          
          export TARGET_BUILD_VARIANT=userdebug
          export SKIP_BOOT_JARS_CHECK=true
          export DONT_UNCOMPRESS_PRIV_APPS_DEXS=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export WITHOUT_CHECK_API=true
          export USE_CCACHE=0
          export SOONG_GEN_COMPDB=0
          
          (
            while true; do
              sleep 120
              if [ -d "$WORK_DIR/out/target/product/kj7/symbols" ]; then
                rm -rf $WORK_DIR/out/target/product/kj7/symbols/* 2>/dev/null || true
              fi
            done
          ) &
          MONITOR_PID=$!
          m -j$(nproc --all) ${{ github.event.inputs.build_target }}
          kill $MONITOR_PID 2>/dev/null || true

      - name: Upload Output Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            ${{ env.WORK_DIR }}/out/target/product/kj7/*.zip
            ${{ env.WORK_DIR }}/out/target/product/kj7/boot.img
            ${{ env.WORK_DIR }}/out/target/product/kj7/vendor_boot.img
          name: PixelOS-KJ7-${{ github.event.inputs.pixelos_branch }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
