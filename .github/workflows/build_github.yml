            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.1/x86-64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.6/arm64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.6/x86-64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.12/arm64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.12/x86-64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.18/arm64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/6.18/x86-64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/mainline/arm64" />
            <remove-project name="kernel/prebuilts/common-modules/virtual-device/mainline/x86-64" />
            <remove-project name="LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b" />
            <remove-project name="kernel/prebuilts/build-tools" />

