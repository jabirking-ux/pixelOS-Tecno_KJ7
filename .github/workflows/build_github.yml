name: Build PixelOS Directly on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: 'PixelOS Branch'
        required: true
        default: 'seventeen'
        type: choice
        options:
          - seventeen
          - sixteen-qpr2
      build_target:
        description: 'Build Target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
          - vendorbootimage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Maximize Runner Free Disk Space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Configure Extra Swap Memory
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-21-jdk aria2
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize PixelOS Manifest (Shallow)
        run: |
          mkdir -p ~/pixelos
          cd ~/pixelos
          repo init -u https://github.com/PixelOS-AOSP/android_manifest.git -b ${{ github.event.inputs.pixelos_branch }} --depth=1 --git-lfs < /dev/null || true

      - name: Inject Local Tecno KJ7 Manifest
        run: |
          cd ~/pixelos
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/kj7.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/tecno/kj7" name="RapStuff/android_device_tecno_kj7" revision="lineage-23.0" remote="github" />
            <project path="vendor/tecno/kj7" name="RapStuff/android_vendor_tecno_kj7" revision="lineage-22.1" remote="github" />
            <project path="kernel/tecno/kj7" name="RapStuff/android_kernel_tecno_kj7" revision="lineage-23.0" remote="github" />
          </manifest>
          EOF

      - name: Sync Source Tree
        run: |
          cd ~/pixelos
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --depth=1

      - name: Configure KJ7 Makefiles for PixelOS
        run: |
          cd ~/pixelos/device/tecno/kj7
          cat << 'EOF' > AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/pixelos_kj7.mk

          COMMON_LUNCH_CHOICES := \
              pixelos_kj7-user \
              pixelos_kj7-userdebug \
              pixelos_kj7-eng
          EOF

          cat << 'EOF' > pixelos_kj7.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, device/tecno/kj7/device.mk)
          $(call inherit-product, vendor/pixelos/config/common_full_phone.mk)

          PRODUCT_NAME := pixelos_kj7
          PRODUCT_DEVICE := kj7
          PRODUCT_MANUFACTURER := TECNO
          PRODUCT_BRAND := TECNO
          BOARD_VENDOR := TECNO
          PRODUCT_MODEL := TECNO Spark 20 Pro+
          PRODUCT_GMS_CLIENTID_BASE := android-tecno
          PRODUCT_BUILD_PROP_OVERRIDES += \
              DeviceName=KJ7 \
              BuildFingerprint=TECNO/KJ7-OP/TECNO-KJ7:14/UP1A.231005.007/260112V2294:user/release-keys
          EOF

          # Align physical partition sizes
          sed -i 's/BOARD_BOOTIMAGE_PARTITION_SIZE := .*/BOARD_BOOTIMAGE_PARTITION_SIZE := 67108864/g' BoardConfig.mk
          sed -i 's/BOARD_SUPER_PARTITION_SIZE := .*/BOARD_SUPER_PARTITION_SIZE := 8870707200/g' BoardConfig.mk
          sed -i 's/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := .*/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := 8868610048/g' BoardConfig.mk

      - name: Compile PixelOS for Tecno KJ7
        run: |
          cd ~/pixelos
          source build/envsetup.sh
          lunch pixelos_kj7-userdebug
          m -j$(nproc --all) ${{ github.event.inputs.build_target }}

      - name: Upload Output Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          files: |
            ~/pixelos/out/target/product/kj7/*.zip
            ~/pixelos/out/target/product/kj7/boot.img
            ~/pixelos/out/target/product/kj7/vendor_boot.img
          name: PixelOS-KJ7-${{ github.event.inputs.pixelos_branch }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
