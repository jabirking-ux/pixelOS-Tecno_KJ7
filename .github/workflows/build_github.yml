      - name: Sync Source Tree
        run: |
          cd $WORK_DIR
          echo "=== Storage before source tree sync ==="
          df -h .
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --prune || \
          (echo "=== Retry 1 with -j2 ===" && sleep 10 && repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --prune) || \
          (echo "=== Retry 2 with -j1 ===" && sleep 15 && repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --prune)
          echo "=== Storage after source tree sync ==="
          df -h .

      - name: Strip DotRepo Metadata and Unneeded Prebuilts (Keeping All Historic SDK APIs)
        run: |
          cd $WORK_DIR
          echo "=== Storage before stripping .repo and prebuilts ==="
          df -h .
          
          # 1. Eliminate the entire .repo folder immediately (~35-40 GB reclaimed)
          rm -rf .repo
          
          # 2. Eliminate unused host platforms and unneeded docs
          rm -rf cts pdk developers
          rm -rf prebuilts/clang/host/darwin-x86
          rm -rf prebuilts/gcc/darwin-x86
          rm -rf prebuilts/rust/linux-x86/*/share/doc 2>/dev/null || true
          
          # 3. Ensure toolchain/pgo-profiles exists for soong_config.mk
          mkdir -p toolchain/pgo-profiles/sampling
          touch toolchain/pgo-profiles/sampling/afdo_profiles.mk

          # 4. PRESERVE ALL Linux Clang toolchains intact (required by prebuilts/clang/host/linux-x86/Android.bp)
          # 5. PRESERVE ALL Historic SDK APIs 1-35 in prebuilts/sdk 100% intact
          # 6. PRESERVE sdk/ directory intact (sdk/annotations provides java_library_host annotations)
          # 7. PRESERVE ALL VNDK/NDK prebuilts for device proprietary binary linking
          
          echo "=== Storage after aggressive stripping (100+ GB available) ==="
          df -h .


      - name: Deploy Tecno KJ7 Trees & Device Dependencies
        run: |
          cd $WORK_DIR
          echo "=== Installing Tecno KJ7 Device, Vendor, and Kernel Trees ==="
          mkdir -p device/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/device/tecno/kj7 device/tecno/kj7
          
          mkdir -p vendor/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/vendor/tecno/kj7 vendor/tecno/kj7
          
          mkdir -p kernel/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/kernel/tecno/kj7 kernel/tecno/kj7

          # Fetch MediaTek Sepolicy if not already present
          if [ ! -d "device/mediatek/sepolicy_vndr" ]; then
            echo "=== Cloning MediaTek sepolicy ==="
            mkdir -p device/mediatek
            git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git device/mediatek/sepolicy_vndr || \
            git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git device/mediatek/sepolicy_vndr || true
          fi

          # Ensure compatibility between vendor/custom and vendor/pixelos paths
          if [ -d "vendor/custom" ] && [ ! -d "vendor/pixelos" ]; then
            ln -s custom vendor/pixelos
          fi
          if [ -d "vendor/pixelos" ] && [ ! -d "vendor/custom" ]; then
            ln -s pixelos vendor/custom
          fi

          # Ensure dummy soong namespaces exist for any external references
          for ns in hardware/transsion hardware/mediatek hardware/mediatek/libmtkperf_client vendor/mediatek/ims; do
            mkdir -p "$ns"
            if [ ! -f "$ns/Android.bp" ]; then
              echo 'soong_namespace {}' > "$ns/Android.bp"
            fi
          done

          # Ensure sdk/annotations is intact (required by error_prone_android_framework_lib)
          if [ ! -f "sdk/annotations/Android.bp" ]; then
            echo "=== Providing fallback sdk/annotations module ==="
            mkdir -p sdk/annotations/src/android/annotation
            printf 'java_library_host {\n    name: "annotations",\n    srcs: ["src/**/*.java"],\n    java_resource_dirs: ["src"],\n}\n' > sdk/annotations/Android.bp
            printf 'package android.annotation;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n@Retention(RetentionPolicy.CLASS)\npublic @interface NonNull {}\n' > sdk/annotations/src/android/annotation/NonNull.java
          fi

          # Ensure PlatformMotionTestingComposeValues is available (required by PlatformComposeCore / SystemUI)
          if [ ! -f "platform_testing/libraries/motion/compose/values/Android.bp" ]; then
            echo "=== Providing fallback PlatformMotionTestingComposeValues module ==="
            mkdir -p platform_testing/libraries/motion/compose/values/src/platform/test/motion/compose/values
            printf '<manifest package="platform.test.motion.compose.values" />\n' > platform_testing/libraries/motion/compose/values/AndroidManifest.xml
            printf 'android_library {\n    name: "PlatformMotionTestingComposeValues",\n    manifest: "AndroidManifest.xml",\n    srcs: ["src/**/*.kt"],\n    sdk_version: "current",\n}\n' > platform_testing/libraries/motion/compose/values/Android.bp
            printf 'package platform.test.motion.compose.values\nobject MotionTestValue\n' > platform_testing/libraries/motion/compose/values/src/platform/test/motion/compose/values/MotionTestValue.kt
          fi

          echo "=== Trees Installed ==="
          ls -ld device/tecno/kj7 vendor/tecno/kj7 kernel/tecno/kj7 device/mediatek/sepolicy_vndr || true

      - name: Compile PixelOS for Tecno KJ7 (Continuous Symbol Stripping)
        run: |
          cd $WORK_DIR
          echo "=== Protecting GitHub Actions runner processes against OOM killer ==="
          pgrep -f "Runner" | while read pid; do
            sudo sh -c "echo -1000 > /proc/$pid/oom_score_adj" 2>/dev/null || true
          done

          echo "=== Setting up zram and 10 GB NVMe Swapfile for High-Speed Compilation ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon -p 10 /swapfile

          sudo modprobe zram num_devices=1 2>/dev/null || true
          if command -v zramctl >/dev/null 2>&1; then
            sudo zramctl --find --size 8G --algorithm zstd 2>/dev/null || \
            sudo zramctl --find --size 8G --algorithm lz4 2>/dev/null || true
            sudo mkswap /dev/zram0 2>/dev/null || true
            sudo swapon -p 100 /dev/zram0 2>/dev/null || true
          fi

          sudo sysctl -w vm.swappiness=60
          sudo sysctl -w vm.vfs_cache_pressure=100
          free -h
          df -h /
          
          echo "=== Optimizing Blueprint & Soong for 16 GB Runner (Eliminates GC Throttling) ==="
          find build/ -type f \( -name "*.go" -o -name "*.sh" -o -name "*.bash" \) -exec sed -i 's/env -i /env -i GOMEMLIMIT=11GiB GOGC=80 /g' {} +
          
          source build/envsetup.sh
          echo "=== Configuring Lunch Target for Android 15 / PixelOS 17 ==="
          lunch pixelos_kj7-trunk_staging-userdebug || \
          lunch pixelos_kj7-ap3a-userdebug || \
          lunch pixelos_kj7 trunk_staging userdebug || \
          lunch pixelos_kj7-userdebug
          
          export TARGET_BUILD_VARIANT=userdebug
          export SKIP_BOOT_JARS_CHECK=true
          export DONT_UNCOMPRESS_PRIV_APPS_DEXS=true
          export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=0
          export SOONG_GEN_COMPDB=0
          export GOGC=80
          export GOMEMLIMIT=11GiB
          export RUN_ERROR_PRONE=false
          
          # Monitor disk space: only purge intermediate debug symbols when storage exceeds 85%
          (
            while true; do
              sleep 300
              USAGE=$(df / | awk 'NR==2 {print $5}' | tr -d '%')
              if [ "$USAGE" -gt 85 ] && [ -d "$WORK_DIR/out/target/product/kj7" ]; then
                echo "=== High disk usage ($USAGE%) detected: purging debug symbols ==="
                rm -rf $WORK_DIR/out/target/product/kj7/symbols 2>/dev/null || true
                rm -rf $WORK_DIR/out/target/product/kj7/obj/SHARED_LIBRARIES/*_intermediates/LINKED 2>/dev/null || true
                rm -rf $WORK_DIR/out/target/product/kj7/obj/STATIC_LIBRARIES/*_intermediates/LINKED 2>/dev/null || true
              fi
            done
          ) &
          MONITOR_PID=$!
          m -j$(nproc --all) ${{ github.event.inputs.build_target }}
          kill $MONITOR_PID 2>/dev/null || true

      - name: Upload Output Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            ${{ env.WORK_DIR }}/out/target/product/kj7/*.zip
            ${{ env.WORK_DIR }}/out/target/product/kj7/boot.img
            ${{ env.WORK_DIR }}/out/target/product/kj7/vendor_boot.img
          name: PixelOS-KJ7-${{ github.event.inputs.pixelos_branch }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
