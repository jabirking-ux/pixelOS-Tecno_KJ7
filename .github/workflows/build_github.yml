name: Build PixelOS Directly on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: 'PixelOS Manifest Branch (e.g., seventeen)'
        required: true
        default: 'seventeen'
      build_target:
        description: 'Build Target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
          - vendorbootimage

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Extreme Heavyweight Host Software & Snap Purge (Minimal Lightweight Debian Base - 130+ GB Free)
        run: |
          echo "=== Storage before purge ==="
          df -h /
          
          # Disable and purge background services
          sudo systemctl disable --now snapd.service snapd.socket mysql docker containerd 2>/dev/null || true
          
          # Unmount and remove all snaps
          for m in /snap/*/*; do
            if mountpoint -q "$m"; then
              sudo umount -l "$m" 2>/dev/null || true
            fi
          done
          sudo apt-get purge -y snapd 2>/dev/null || true
          sudo rm -rf /snap /var/snap /var/lib/snapd /var/cache/snapd ~/snap 2>/dev/null || true

          # Purge heavy pre-installed packages to reduce host to minimal Debian
          sudo apt-get purge -y \
            azure-cli \
            google-cloud-sdk \
            google-chrome-stable \
            firefox \
            microsoft-edge-stable \
            mysql-server mysql-client mysql-common \
            postgresql postgresql-client postgresql-common \
            mongodb-org* \
            libpq-dev \
            nginx \
            apache2* \
            ant ant-optional \
            kubectl \
            helm \
            subversion \
            mercurial 2>/dev/null || true
          
          # Remove massive pre-installed runtimes and SDKs
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/php*
          sudo rm -rf /usr/share/sbt*
          sudo rm -rf /usr/share/gradle*
          sudo rm -rf /usr/share/apache-maven*
          sudo rm -rf /usr/lib/jvm/temurin-*
          sudo rm -rf /usr/lib/jvm/zulu-*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/info/*
          sudo rm -rf /usr/share/locale/*
          sudo rm -rf /usr/share/fonts/*
          sudo rm -rf /var/cache/apt/*
          sudo rm -rf /var/lib/mysql
          sudo rm -rf /var/lib/postgresql
          sudo rm -rf /var/lib/docker
          sudo rm -rf /etc/docker
          sudo rm -rf /var/run/docker.sock
          sudo rm -rf /var/log/*
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          
          echo "=== Storage after extreme purge (130+ GB available on native NVMe SSD) ==="
          df -h /

      - name: Checkout Tecno KJ7 Repository
        uses: actions/checkout@v4
        with:
          path: kj7_source

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential btrfs-progs ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-21-jdk aria2 libtinfo5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.version HTTP/1.1

      - name: Mount Transparently Compressed Btrfs Filesystem for Entire Workspace & Out (Saves 80+ GB)
        run: |
          TARGET_DIR="$GITHUB_WORKSPACE/pixelos"
          mkdir -p "$TARGET_DIR"
          echo "WORK_DIR=$TARGET_DIR" >> $GITHUB_ENV
          
          echo "=== Setting up 120GB sparse Btrfs filesystem on NVMe root with zstd:3 compression ==="
          BACKING_DIR="$HOME/btrfs_backing"
          mkdir -p "$BACKING_DIR"
          sudo truncate -s 120G "$BACKING_DIR/workspace.img"
          sudo mkfs.btrfs -m single "$BACKING_DIR/workspace.img"
          
          sudo mount -o loop,compress=zstd:3,noatime,nodiratime,space_cache=v2 "$BACKING_DIR/workspace.img" "$TARGET_DIR"
          sudo chown -R $(id -u):$(id -g) "$TARGET_DIR"
          
          echo "=== Mounted compressed workspace directory ==="
          df -h "$TARGET_DIR"

      - name: Initialize PixelOS Manifest on Compressed Workspace
        run: |
          cd "$WORK_DIR"
          echo "=== Storage before manifest init ==="
          df -h .
          repo init -u https://github.com/PixelOS-AOSP/android_manifest.git -b ${{ github.event.inputs.pixelos_branch }} \
            --groups=default,-mips,-x86,-darwin,-emulator,-notdefault,-tests,-cts,-device \
            --depth=1 < /dev/null

      - name: Inject Safe Bloat Removal Local Manifest (Saves 70+ GB)
        run: |
          cd $WORK_DIR
          mkdir -p .repo/local_manifests
          
          cat << 'EOF' > .repo/local_manifests/remove_bloat.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Heavy Test Suites & Testing Frameworks (100% Safe - only used by 'm cts/vts', not 'm bacon') (~10 GB) -->
            <remove-project name="platform/cts" />
            <remove-project name="platform/pdk" />
            <remove-project name="platform/developers/build" />
            <remove-project name="platform/developers/samples/android" />
            <remove-project name="platform/test/vts" />
            <remove-project name="platform/test/vts-testcase/kernel" />
            <remove-project name="platform/test/vts-testcase/hal" />
            <remove-project name="platform/test/vts-testcase/security" />
            <remove-project name="platform/test/vts-testcase/performance" />
            <remove-project name="platform/test/vts-testcase/vndk" />
            <remove-project name="platform/test/vts-testcase/nbu" />
            <remove-project name="platform/test/catbox" />
            <remove-project name="platform/test/cts-root" />
            <remove-project name="platform/test/dittosuite" />
            <remove-project name="platform/test/mlts/benchmark" />
            <remove-project name="platform/test/mlts/models" />
            <remove-project name="platform/test/robolectric-extensions" />
            <remove-project name="platform/test/suite_harness" />
            <remove-project name="platform/tools/test/connectivity" />
            <remove-project name="platform/tools/tradefederation" />
            <remove-project name="platform/tools/tradefederation/contrib" />
            <remove-project name="platform/tools/tradefederation/prebuilts" />

            <!-- Non-Production Test Frameworks & Debug Tooling (100% Safe) (~10 GB) -->
            <remove-project name="platform/external/deqp" />
            <remove-project name="platform/packages/apps/Test/connectivity" />

            <!-- Stock AOSP Apps Replaced by Pixel GMS Apps (100% Safe) (~8 GB) -->
            <remove-project name="platform/packages/apps/Browser2" />
            <remove-project name="platform/packages/apps/Calendar" />
            <remove-project name="platform/packages/apps/Camera2" />
            <remove-project name="platform/packages/apps/Contacts" />
            <remove-project name="platform/packages/apps/DeskClock" />
            <remove-project name="platform/packages/apps/Dialer" />
            <remove-project name="platform/packages/apps/Gallery2" />
