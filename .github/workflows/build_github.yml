            <remove-project name="platform/tools/trebuchet" />
            <remove-project name="platform/tools/security" />
            <remove-project name="platform/tools/repohooks" />
            <remove-project name="platform/tools/ndkports" />
            <remove-project name="platform/tools/loganalysis" />
