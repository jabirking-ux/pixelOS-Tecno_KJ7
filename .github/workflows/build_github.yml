name: Build PixelOS Directly on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: 'PixelOS Manifest Branch (e.g., seventeen)'
        required: true
        default: 'seventeen'
      build_target:
        description: 'Build Target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
          - vendorbootimage

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Extreme Heavyweight Host Software & Snap Purge (Minimal Lightweight Debian Base - 130+ GB Free)
        run: |
          echo "=== Storage before purge ==="
          df -h /
          
          # Disable and purge background services
          sudo systemctl disable --now snapd.service snapd.socket mysql docker containerd 2>/dev/null || true
          
          # Unmount and remove all snaps
          for m in /snap/*/*; do
            if mountpoint -q "$m"; then
              sudo umount -l "$m" 2>/dev/null || true
            fi
          done
          sudo apt-get purge -y snapd 2>/dev/null || true
          sudo rm -rf /snap /var/snap /var/lib/snapd /var/cache/snapd ~/snap 2>/dev/null || true

          # Purge heavy pre-installed packages to reduce host to minimal Debian
          sudo apt-get purge -y \
            azure-cli \
            google-cloud-sdk \
            google-chrome-stable \
            firefox \
            microsoft-edge-stable \
            mysql-server mysql-client mysql-common \
            postgresql postgresql-client postgresql-common \
            mongodb-org* \
            libpq-dev \
            nginx \
            apache2* \
            ant ant-optional \
            kubectl \
            helm \
            subversion \
            mercurial 2>/dev/null || true
          
          # Remove massive pre-installed runtimes and SDKs
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /usr/share/php*
          sudo rm -rf /usr/share/sbt*
          sudo rm -rf /usr/share/gradle*
          sudo rm -rf /usr/share/apache-maven*
          sudo rm -rf /usr/lib/jvm/temurin-*
          sudo rm -rf /usr/lib/jvm/zulu-*
          sudo rm -rf /usr/share/man/*
          sudo rm -rf /usr/share/doc/*
          sudo rm -rf /usr/share/info/*
          sudo rm -rf /usr/share/locale/*
          sudo rm -rf /usr/share/fonts/*
          sudo rm -rf /var/cache/apt/*
          sudo rm -rf /var/lib/mysql
          sudo rm -rf /var/lib/postgresql
          sudo rm -rf /var/lib/docker
          sudo rm -rf /etc/docker
          sudo rm -rf /var/run/docker.sock
          sudo rm -rf /var/log/*
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          
          echo "=== Storage after extreme purge (130+ GB available on native NVMe SSD) ==="
          df -h /

      - name: Checkout Tecno KJ7 Repository
        uses: actions/checkout@v4
        with:
          path: kj7_source

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential btrfs-progs ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-21-jdk aria2 libtinfo5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 60
          git config --global http.version HTTP/1.1

      - name: Initialize PixelOS Manifest on Native NVMe Storage (130+ GB Headroom)
        run: |
          TARGET_DIR="$GITHUB_WORKSPACE/pixelos"
          mkdir -p "$TARGET_DIR"
          echo "WORK_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd "$TARGET_DIR"
          echo "=== Storage before manifest init ==="
          df -h .
          repo init -u https://github.com/PixelOS-AOSP/android_manifest.git -b ${{ github.event.inputs.pixelos_branch }} \
            --groups=default,-mips,-x86,-darwin,-emulator,-notdefault,-tests,-cts,-device \
            --depth=1 < /dev/null

      - name: Inject Safe Bloat Removal Local Manifest (Saves 70+ GB)
        run: |
          cd $WORK_DIR
          mkdir -p .repo/local_manifests
          python3 - << 'PYEOF'
          import subprocess

          bloat_candidates = [
              "platform/cts", "platform/pdk", "platform/developers/build", "platform/developers/samples/android",
              "platform/test/vts", "platform/test/vts-testcase/kernel", "platform/test/vts-testcase/hal",
              "platform/test/vts-testcase/security", "platform/test/vts-testcase/performance",
              "platform/test/vts-testcase/vndk", "platform/test/vts-testcase/nbu", "platform/test/catbox",
              "platform/test/cts-root", "platform/test/dittosuite", "platform/test/mlts/benchmark",
              "platform/test/mlts/models", "platform/test/robolectric-extensions", "platform/test/suite_harness",
              "platform/tools/test/connectivity", "platform/tools/tradefederation",
              "platform/tools/tradefederation/contrib", "platform/tools/tradefederation/prebuilts",
              "platform/external/deqp", "platform/packages/apps/Test/connectivity",
              "platform/packages/apps/Browser2", "platform/packages/apps/Calendar", "platform/packages/apps/Camera2",
              "platform/packages/apps/Contacts", "platform/packages/apps/DeskClock", "platform/packages/apps/Dialer",
              "platform/packages/apps/Gallery2", "platform/packages/apps/HTMLViewer", "platform/packages/apps/Messaging",
              "platform/packages/apps/Music", "platform/packages/apps/QuickSearchBox", "platform/packages/apps/WallpaperPicker2",
              "platform/packages/apps/EmergencyInfo", "platform/packages/apps/Tag", "platform/packages/apps/ThemePicker",
              "platform/packages/services/AlternativeNetworkAccess",
              "platform/tools/doc_generation", "platform/tools/currysrc", "platform/tools/trebuchet",
              "platform/tools/security", "platform/tools/repohooks", "platform/tools/ndkports",
              "platform/tools/loganalysis", "platform/tools/aadevtools", "platform/tools/acloud",
              "platform/tools/apifinder", "platform/tools/carrier_settings", "platform/tools/deviceinfra/prebuilts",
              "platform/tools/test/desktop/mobly", "platform/tools/test/mobly_extensions",
              "platform/tools/test/mobly_snippets", "platform/tools/test/openhst", "platform/tools/treble",
              "platform/packages/apps/Car/SystemUI", "platform/packages/apps/Car/Cluster",
              "platform/packages/apps/Car/DebuggingRestrictionController", "platform/packages/apps/Car/LatinIME",
              "platform/packages/apps/Car/Launcher", "platform/packages/apps/Car/LocalMediaPlayer",
              "platform/packages/apps/Car/Notification", "platform/packages/apps/Car/Provision",
              "platform/packages/apps/Car/RotaryController", "platform/packages/apps/Car/Settings",
              "platform/packages/apps/Car/systemlibs", "platform/packages/apps/Car/SystemUpdater",
              "platform/system/software_defined_vehicle/common", "platform/system/software_defined_vehicle/health_monitor",
              "platform/system/software_defined_vehicle/lifecycle_management", "platform/system/software_defined_vehicle/middleware",
              "platform/system/software_defined_vehicle/orchestration", "platform/system/software_defined_vehicle/samples",
              "platform/system/software_defined_vehicle/sdv_gateway", "platform/system/software_defined_vehicle/service_bundles_registry",
              "platform/system/software_defined_vehicle/some_ip", "platform/system/software_defined_vehicle/tools",
              "platform/system/software_defined_vehicle/update_manager", "platform/system/software_defined_vehicle/vpm",
              "platform/system/software_defined_vehicle/vsidl", "platform/system/software_defined_vehicle/automotive_services",
              "platform/system/software_defined_vehicle/platform", "platform/system/software_defined_vehicle/telemetry",
              "platform/packages/apps/TvSettings", "platform/packages/apps/TvSystemUI",
              "platform/prebuilts/android-emulator", "platform/prebuilts/qemu-kernel",
              "device/google/cuttlefish", "device/google/cuttlefish_prebuilts", "device/google/cuttlefish_vmm",
              "device/generic/arm64", "device/generic/armv7-a-neon", "device/generic/car", "device/generic/common",
              "device/generic/trusty", "device/generic/x86", "device/generic/x86_64", "device/linaro/hikey",
              "device/linaro/hikey-kernel",
              "platform/prebuilts/clang/host/darwin-x86", "platform/prebuilts/go/darwin-x86",
              "platform/prebuilts/rust-toolchain/darwin", "platform/prebuilts/rust-toolchain/linux-musl-x86",
              "platform/prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8",
              "kernel/prebuilts/6.1/x86-64", "kernel/prebuilts/6.6/x86-64", "kernel/prebuilts/6.12/x86-64",
              "kernel/prebuilts/6.18/x86-64", "kernel/prebuilts/mainline/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/6.1/arm64", "kernel/prebuilts/common-modules/virtual-device/6.1/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/6.6/arm64", "kernel/prebuilts/common-modules/virtual-device/6.6/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/6.12/arm64", "kernel/prebuilts/common-modules/virtual-device/6.12/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/6.18/arm64", "kernel/prebuilts/common-modules/virtual-device/6.18/x86-64",
              "kernel/prebuilts/common-modules/virtual-device/mainline/arm64", "kernel/prebuilts/common-modules/virtual-device/mainline/x86-64",
              "LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b", "kernel/prebuilts/build-tools",
              "LineageOS/android_hardware_qcom_sm7250_display", "LineageOS/android_hardware_qcom_sm7250_gps",
              "LineageOS/android_hardware_qcom_sm8150_display", "LineageOS/android_hardware_qcom_sm8150_gps",
              "LineageOS/android_device_qcom_sepolicy", "LineageOS/android_device_qcom_sepolicy_vndr",
              "LineageOS/android_hardware_qcom_bootctrl", "LineageOS/android_hardware_qcom-caf_common",
              "LineageOS/android_hardware_qcom_audio", "LineageOS/android_hardware_qcom_display",
              "LineageOS/android_hardware_qcom_media", "LineageOS/android_vendor_qcom_opensource_agm",
              "LineageOS/android_vendor_qcom_opensource_audioreach-graphservices",
              "LineageOS/android_vendor_qcom_opensource_arpal-lx", "LineageOS/android_hardware_qcom_audio-ar",
              "LineageOS/android_vendor_qcom_opensource_data-ipa-cfg-mgr", "LineageOS/android_vendor_qcom_opensource_dataipa",
              "LineageOS/android_vendor_qcom_opensource_display-core", "LineageOS/android_vendor_qcom_opensource_display-intf",
              "LineageOS/android_hardware_qcom_thermal", "LineageOS/android_hardware_qcom_wlan",
              "LineageOS/android_vendor_qcom_opensource_audio-hal_st-hal",
              "LineageOS/android_vendor_qcom_opensource_audio-hal_st-hal-ar",
              "LineageOS/android_vendor_qcom_opensource_audio-commonsys-intf",
              "LineageOS/android_vendor_qcom_opensource_display-commonsys-intf",
              "LineageOS/android_vendor_qcom_opensource_audio", "LineageOS/android_vendor_qcom_opensource_display-commonsys",
              "LineageOS/android_vendor_qcom_opensource_fm-commonsys", "LineageOS/android_vendor_qcom_opensource_wfd-commonsys",
              "LineageOS/android_vendor_qcom_opensource_core-utils-sys", "LineageOS/android_vendor_qcom_opensource_core-utils-vendor",
              "LineageOS/android_vendor_qcom_opensource_dataservices", "LineageOS/android_vendor_qcom_opensource_display",
              "LineageOS/android_vendor_qcom_opensource_healthd-ext", "LineageOS/android_vendor_qcom_opensource_interfaces",
              "LineageOS/android_vendor_qcom_opensource_libfmjni", "LineageOS/android_vendor_qcom_opensource_libqspa",
              "LineageOS/android_vendor_qcom_opensource_libvmmem", "LineageOS/android_vendor_qcom_opensource_power",
              "LineageOS/android_vendor_qcom_opensource_thermal-engine", "LineageOS/android_vendor_qcom_opensource_usb",
              "LineageOS/android_vendor_qcom_opensource_vibrator", "LineageOS/android_vendor_codeaurora_telephony",
              "trusty/external/trusted-firmware-a", "trusty/external/trusty", "trusty/external/headers",
              "trusty/lk/common", "trusty/external/musl", "kernel/prebuilts/common-modules/trusty/6.6/arm64",
              "kernel/prebuilts/common-modules/trusty/6.12/arm64", "trusty/device/arm/generic-arm64",
              "trusty/device/arm/vexpress-a15", "trusty/device/common", "trusty/device/desktop",
              "trusty/device/nxp/imx7d", "trusty/device/x86/generic-x86_64", "trusty/lk/nxp",
              "trusty/host/common", "trusty/lk/trusty", "trusty/app/authmgr", "trusty/app/avb",
              "trusty/app/cast-auth", "trusty/app/confirmationui", "trusty/app/gatekeeper",
              "trusty/app/keymaster", "trusty/app/keymint", "trusty/app/sample", "trusty/app/secretkeeper",
              "trusty/app/storage", "trusty/user/desktop", "trusty/vendor/google/aosp"
          ]

          try:
              res = subprocess.run(["repo", "list", "-n"], capture_output=True, text=True, check=True)
              active = set(line.strip() for line in res.stdout.splitlines() if line.strip())
          except Exception:
              active = set(bloat_candidates)

          xml_lines = ['<?xml version="1.0" encoding="UTF-8"?>', '<manifest>']
          removed_count = 0
          for p in bloat_candidates:
              if p in active:
                  xml_lines.append(f'  <remove-project name="{p}" />')
                  removed_count += 1
          xml_lines.append('</manifest>')

          with open('.repo/local_manifests/remove_bloat.xml', 'w') as f:
              for line in xml_lines:
                  f.write(line + chr(10))
          print(f"=== Successfully dynamically generated remove_bloat.xml with {removed_count} active projects removed ===")
          PYEOF
      - name: Sync Source Tree
        run: |
          cd $WORK_DIR
          echo "=== Storage before source tree sync ==="
          df -h .
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --prune || \
          (echo "=== Retry 1 with -j2 ===" && sleep 10 && repo sync -c -j2 --force-sync --no-clone-bundle --no-tags --prune) || \
          (echo "=== Retry 2 with -j1 ===" && sleep 15 && repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --prune)
          echo "=== Storage after source tree sync ==="
          df -h .

      - name: Strip DotRepo Metadata and Unneeded Prebuilts (Keeping All Historic SDK APIs)
        run: |
          cd $WORK_DIR
          echo "=== Storage before stripping .repo and prebuilts ==="
          df -h .
          
          # 1. Eliminate the entire .repo folder immediately (~35-40 GB reclaimed)
          rm -rf .repo
          
          # 2. Eliminate unused host platforms and unneeded docs
          rm -rf pdk developers
          rm -rf prebuilts/clang/host/darwin-x86
          rm -rf prebuilts/gcc/darwin-x86
          rm -rf prebuilts/gcc/linux-x86/host/x86_64-w64-mingw32-4.8
          rm -rf prebuilts/gcc/linux-x86/mips
          rm -rf prebuilts/rust/darwin-x86
          rm -rf prebuilts/go/darwin-x86
          rm -rf prebuilts/jdk/jdk8/darwin-x86 prebuilts/jdk/jdk9/darwin-x86 prebuilts/jdk/jdk11/darwin-x86
          rm -rf prebuilts/misc/darwin-x86
          rm -rf prebuilts/abi-dumps
          rm -rf prebuilts/rust/linux-x86/*/share/doc 2>/dev/null || true
          
          # 3. Ensure toolchain/pgo-profiles exists for soong_config.mk
          mkdir -p toolchain/pgo-profiles/sampling
          touch toolchain/pgo-profiles/sampling/afdo_profiles.mk

          # 4. PRESERVE ALL Linux Clang toolchains intact (required by prebuilts/clang/host/linux-x86/Android.bp)
          # 5. PRESERVE ALL Historic SDK APIs 1-35 in prebuilts/sdk 100% intact
          # 6. PRESERVE sdk/ directory intact (sdk/annotations provides java_library_host annotations)
          # 7. PRESERVE ALL VNDK/NDK prebuilts for device proprietary binary linking
          
          echo "=== Storage after aggressive stripping (100+ GB available) ==="
          df -h .

      - name: Mount Transparently Compressed Btrfs Filesystem for Out Directory (Saves 40+ GB)
        run: |
          cd $WORK_DIR
          echo "=== Setting up 70GB sparse Btrfs filesystem on NVMe root with zstd:1 fast compression ==="
          BACKING_DIR="$HOME/btrfs_backing"
          mkdir -p "$BACKING_DIR"
          sudo truncate -s 70G "$BACKING_DIR/out_sparse.img"
          sudo mkfs.btrfs -m single "$BACKING_DIR/out_sparse.img"
          
          mkdir -p out
          sudo mount -o loop,compress-force=zstd:1,noatime,nodiratime,space_cache=v2,discard "$BACKING_DIR/out_sparse.img" out
          sudo chown -R $(id -u):$(id -g) out
          
          echo "=== Mounted compressed out directory ==="
          df -h out

      - name: Deploy Tecno KJ7 Trees & Device Dependencies
        run: |
          cd $WORK_DIR
          echo "=== Installing Tecno KJ7 Device, Vendor, Kernel Trees & CTS Libraries ==="
          mkdir -p device/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/device/tecno/kj7 device/tecno/kj7

          # Deploy cts/libs/json (provides jsonlib required by protologtool-lib)
          if [ -d "$GITHUB_WORKSPACE/kj7_source/cts" ]; then
            echo "=== Installing cts/libs/json ==="
            mkdir -p cts
            cp -r $GITHUB_WORKSPACE/kj7_source/cts/* cts/
          fi
          
          mkdir -p vendor/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/vendor/tecno/kj7 vendor/tecno/kj7
          
          mkdir -p kernel/tecno
          cp -r $GITHUB_WORKSPACE/kj7_source/kernel/tecno/kj7 kernel/tecno/kj7

          # Fetch MediaTek Sepolicy if not already present
          if [ ! -d "device/mediatek/sepolicy_vndr" ]; then
            echo "=== Cloning MediaTek sepolicy ==="
            mkdir -p device/mediatek
            git clone --depth=1 -b lineage-24.0 https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git device/mediatek/sepolicy_vndr || \
            git clone --depth=1 -b lineage-23.0 https://github.com/LineageOS/android_device_mediatek_sepolicy_vndr.git device/mediatek/sepolicy_vndr || true
          fi

          # Ensure compatibility between vendor/custom and vendor/pixelos paths
          if [ -d "vendor/custom" ] && [ ! -d "vendor/pixelos" ]; then
            ln -s custom vendor/pixelos
          fi
          if [ -d "vendor/pixelos" ] && [ ! -d "vendor/custom" ]; then
            ln -s pixelos vendor/custom
          fi

          # Ensure dummy soong namespaces exist for any external references
          for ns in hardware/transsion hardware/mediatek hardware/mediatek/libmtkperf_client vendor/mediatek/ims; do
            mkdir -p "$ns"
            if [ ! -f "$ns/Android.bp" ]; then
              echo 'soong_namespace {}' > "$ns/Android.bp"
            fi
          done

          # Ensure sdk/annotations is intact (required by error_prone_android_framework_lib)
          if [ ! -f "sdk/annotations/Android.bp" ]; then
            echo "=== Providing fallback sdk/annotations module ==="
            mkdir -p sdk/annotations/src/android/annotation
            printf 'java_library_host {\n    name: "annotations",\n    srcs: ["src/**/*.java"],\n    java_resource_dirs: ["src"],\n}\n' > sdk/annotations/Android.bp
            printf 'package android.annotation;\nimport java.lang.annotation.Retention;\nimport java.lang.annotation.RetentionPolicy;\n@Retention(RetentionPolicy.CLASS)\npublic @interface NonNull {}\n' > sdk/annotations/src/android/annotation/NonNull.java
          fi

          # Ensure PlatformMotionTestingComposeValues is available (required by PlatformComposeCore / SystemUI)
          if [ ! -f "platform_testing/libraries/motion/compose/values/Android.bp" ]; then
            echo "=== Providing fallback PlatformMotionTestingComposeValues module ==="
            mkdir -p platform_testing/libraries/motion/compose/values/src/platform/test/motion/compose/values
            printf '<manifest package="platform.test.motion.compose.values" />\n' > platform_testing/libraries/motion/compose/values/AndroidManifest.xml
            printf 'android_library {\n    name: "PlatformMotionTestingComposeValues",\n    manifest: "AndroidManifest.xml",\n    srcs: ["src/**/*.kt"],\n    sdk_version: "current",\n}\n' > platform_testing/libraries/motion/compose/values/Android.bp
            printf 'package platform.test.motion.compose.values\nobject MotionTestValue\n' > platform_testing/libraries/motion/compose/values/src/platform/test/motion/compose/values/MotionTestValue.kt
          fi

          # Ensure jsonlib is available (required by protologtool-lib)
          if [ ! -f "cts/libs/json/Android.bp" ]; then
            echo "=== Providing fallback cts/libs/json module ==="
            mkdir -p cts/libs/json
            printf 'package { default_applicable_licenses: ["Android-Apache-2.0"] }\njava_library {\n    name: "json",\n    host_supported: true,\n    srcs: ["src/**/*.java"],\n    sdk_version: "current",\n    java_version: "11",\n}\njava_library_host {\n    name: "jsonlib",\n    static_libs: ["json"],\n}\n' > cts/libs/json/Android.bp
          fi

                    # Ensure vendor.mediatek.hardware.mtkpower fallback stub exists
          if [ ! -f "vendor/tecno/kj7/empty.c" ]; then
            printf 'int main(void) { return 0; }\nvoid mtkpower_stub(void) {}\n' > vendor/tecno/kj7/empty.c
          fi

          echo "=== Trees Installed ==="
          ls -ld device/tecno/kj7 vendor/tecno/kj7 kernel/tecno/kj7 device/mediatek/sepolicy_vndr || true

      - name: Compile PixelOS for Tecno KJ7 (Continuous Symbol Stripping)
        run: |
          cd $WORK_DIR
          echo "=== Launching Continuous Runner Protection Daemon (Immunity to CPU/IO Starvation & OOM) ==="
          (
            while true; do
              pgrep -f "Runner" | while read pid; do
                sudo renice -n -15 -p $pid 2>/dev/null || true
                sudo ionice -c 1 -n 0 -p $pid 2>/dev/null || true
                sudo sh -c "echo -1000 > /proc/$pid/oom_score_adj" 2>/dev/null || true
              done
              sleep 10
            done
          ) &
          RUNNER_DAEMON_PID=$!

          echo "=== Setting up 6 GB NVMe Swapfile (Saves 10 GB SSD Headroom) ==="
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo fallocate -l 6G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=6144
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          sudo sysctl -w vm.swappiness=10
          sudo sysctl -w vm.vfs_cache_pressure=50
          sudo sysctl -w vm.dirty_ratio=20
          sudo sysctl -w vm.dirty_background_ratio=5
          free -h
          df -h /
          
          echo "=== Optimizing Blueprint & Soong for 16 GB Runner (In-RAM Garbage Collection) ==="
          
          source build/envsetup.sh
          echo "=== Configuring Lunch Target for Android 15 / PixelOS 17 ==="
          lunch pixelos_kj7-trunk_staging-userdebug || \
          lunch pixelos_kj7-ap3a-userdebug || \
          lunch pixelos_kj7 trunk_staging userdebug || \
          lunch pixelos_kj7-userdebug
          
          export TARGET_BUILD_VARIANT=userdebug
          export ALLOW_MISSING_DEPENDENCIES=true
          export SOONG_ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_BROKEN_MISSING_PGO_DATA=true
          export SKIP_BOOT_JARS_CHECK=true
          export DONT_UNCOMPRESS_PRIV_APPS_DEXS=true
          export WITH_DEXPREOPT=false
          export WITH_DEXPREOPT_BOOT_IMG_AND_SYSTEM_SERVER_ONLY=false
          export USE_CCACHE=0
          export SOONG_GEN_COMPDB=0
          export GOGC=50
          export GOMEMLIMIT=4GiB
          export RUN_ERROR_PRONE=false
          export TURBINE_ENABLED=true
          export SKIP_ABI_CHECKS=true
          export SOONG_STRIP_ALL=true
          
          # Active Disk Space Guard: Check every 20 seconds, purge emergency cache if root drops below 5 GB
          (
            while true; do
              sleep 20
              AVAIL_GB=$(df -BG / | awk 'NR==2 {print $4}' | tr -d 'G')
              if [ -n "$AVAIL_GB" ] && [ "$AVAIL_GB" -lt 5 ]; then
                echo "=== LOW DISK SPACE WARNING: ${AVAIL_GB}GB remaining on root. Executing emergency cleanup ==="
                sudo rm -rf /tmp/* /var/tmp/* 2>/dev/null || true
                rm -rf $WORK_DIR/out/target/product/kj7/symbols 2>/dev/null || true
                rm -rf $WORK_DIR/out/target/product/kj7/obj/SHARED_LIBRARIES/*_intermediates/LINKED 2>/dev/null || true
                rm -rf $WORK_DIR/out/target/product/kj7/obj/STATIC_LIBRARIES/*_intermediates/LINKED 2>/dev/null || true
                sync
              fi
            done
          ) &
          DISK_WATCHDOG_PID=$!

          echo "=== Starting Build with High-Priority Runner Protection (nice -n 10 ionice -c 3) ==="
          nice -n 10 ionice -c 3 m -j$(nproc --all) ${{ github.event.inputs.build_target }}
          kill $RUNNER_DAEMON_PID $DISK_WATCHDOG_PID 2>/dev/null || true

      - name: Upload Output Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            ${{ env.WORK_DIR }}/out/target/product/kj7/*.zip
            ${{ env.WORK_DIR }}/out/target/product/kj7/boot.img
            ${{ env.WORK_DIR }}/out/target/product/kj7/vendor_boot.img
          name: PixelOS-KJ7-${{ github.event.inputs.pixelos_branch }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
