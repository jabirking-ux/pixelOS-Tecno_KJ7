            <!-- Android TV Apps (100% Safe) -->
            <remove-project name="platform/packages/apps/TvSettings" />
            <remove-project name="platform/packages/apps/TvSystemUI" />

            <!-- Emulators & Virtual Devices (100% Safe - Tecno KJ7 is physical MediaTek hardware) (~6 GB) -->
