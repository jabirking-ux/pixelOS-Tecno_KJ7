name: Build PixelOS Directly on GitHub Actions

on:
  workflow_dispatch:
    inputs:
      pixelos_branch:
        description: 'PixelOS Branch'
        required: true
        default: 'fourteen'
        type: choice
        options:
          - fourteen
          - fifteen
          - seventeen
      build_target:
        description: 'Build Target'
        required: true
        default: 'bacon'
        type: choice
        options:
          - bacon
          - bootimage
          - vendorbootimage

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Maximize Runner Free Disk Space (Aggressive Cleanup + LVM)
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 512
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          overprovision-lvm: 'true'

      - name: Extreme Purge (Remove unnecessary packages and SDKs)
        run: |
          echo "=== Disk before extreme purge ==="
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/vcpkg
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /var/cache/apt/*
          sudo apt-get clean
          sudo apt-get autoremove -y --purge
          echo "=== Disk after extreme purge ==="
          df -h

      - name: Setup Build Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
            imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 openjdk-21-jdk aria2 libtinfo5
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Initialize PixelOS Manifest (Partial Clone + Blobless)
        run: |
          mkdir -p /workdir/pixelos || mkdir -p ~/pixelos
          TARGET_DIR=$(test -d /workdir && echo "/workdir/pixelos" || echo "$HOME/pixelos")
          echo "WORK_DIR=$TARGET_DIR" >> $GITHUB_ENV
          cd $TARGET_DIR
          # --depth=1 combined with --partial-clone and --clone-filter=blob:none cuts download size by ~70%
          repo init -u https://github.com/PixelOS-AOSP/manifest.git -b ${{ github.event.inputs.pixelos_branch }} --depth=1 --partial-clone --clone-filter=blob:none < /dev/null || \
          repo init -u https://github.com/PixelOS-AOSP/android_manifest.git -b ${{ github.event.inputs.pixelos_branch }} --depth=1 --partial-clone --clone-filter=blob:none < /dev/null

      - name: Inject Local Tecno KJ7 Manifest
        run: |
          cd $WORK_DIR
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/kj7.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project path="device/tecno/kj7" name="RapStuff/android_device_tecno_kj7" revision="lineage-23.0" remote="github" />
            <project path="vendor/tecno/kj7" name="RapStuff/android_vendor_tecno_kj7" revision="lineage-22.1" remote="github" />
            <project path="kernel/tecno/kj7" name="RapStuff/android_kernel_tecno_kj7" revision="lineage-23.0" remote="github" />
          </manifest>
          EOF

      - name: Sync Source Tree (Blobless & Optimized)
        run: |
          cd $WORK_DIR
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune

      - name: Extreme Storage Reclaim (Prune Git History & Build Caches)
        run: |
          cd $WORK_DIR
          echo "=== Storage before git pruning ==="
          df -h
          # Wipe deep git object history from .repo before build begins (frees ~40 GB)
          find .repo/projects -type d -name "objects" -prune -exec rm -rf {} + 2>/dev/null || true
          find .repo/project-objects -type d -name "objects" -prune -exec rm -rf {} + 2>/dev/null || true
          echo "=== Storage after git pruning ==="
          df -h

      - name: Configure KJ7 Makefiles for PixelOS
        run: |
          cd $WORK_DIR/device/tecno/kj7
          cat << 'EOF' > AndroidProducts.mk
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/pixelos_kj7.mk

          COMMON_LUNCH_CHOICES := \
              pixelos_kj7-user \
              pixelos_kj7-userdebug \
              pixelos_kj7-eng
          EOF

          cat << 'EOF' > pixelos_kj7.mk
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, device/tecno/kj7/device.mk)
          $(call inherit-product, vendor/pixelos/config/common_full_phone.mk)

          PRODUCT_NAME := pixelos_kj7
          PRODUCT_DEVICE := kj7
          PRODUCT_MANUFACTURER := TECNO
          PRODUCT_BRAND := TECNO
          BOARD_VENDOR := TECNO
          PRODUCT_MODEL := TECNO Spark 20 Pro+
          PRODUCT_GMS_CLIENTID_BASE := android-tecno
          PRODUCT_BUILD_PROP_OVERRIDES += \
              DeviceName=KJ7 \
              BuildFingerprint=TECNO/KJ7-OP/TECNO-KJ7:14/UP1A.231005.007/260112V2294:user/release-keys
          EOF

          # Align physical partition sizes from stock KJ7 audit
          sed -i 's/BOARD_BOOTIMAGE_PARTITION_SIZE := .*/BOARD_BOOTIMAGE_PARTITION_SIZE := 67108864/g' BoardConfig.mk
          sed -i 's/BOARD_SUPER_PARTITION_SIZE := .*/BOARD_SUPER_PARTITION_SIZE := 8870707200/g' BoardConfig.mk
          sed -i 's/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := .*/BOARD_MEDIATEK_DYNAMIC_PARTITIONS_SIZE := 8868610048/g' BoardConfig.mk

      - name: Compile PixelOS for Tecno KJ7
        run: |
          cd $WORK_DIR
          source build/envsetup.sh
          lunch pixelos_kj7-userdebug
          m -j$(nproc --all) ${{ github.event.inputs.build_target }}

      - name: Upload Output Artifact to GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          files: |
            ${{ env.WORK_DIR }}/out/target/product/kj7/*.zip
            ${{ env.WORK_DIR }}/out/target/product/kj7/boot.img
            ${{ env.WORK_DIR }}/out/target/product/kj7/vendor_boot.img
          name: PixelOS-KJ7-${{ github.event.inputs.pixelos_branch }}
          tag_name: build-${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
